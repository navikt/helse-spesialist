spec:
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 50%
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 2Gi
  replicas:
    min: 8
    max: 8
  kafka:
    pool: nav-prod
  azure:
    application:
      claims:
        groups:
          - id: 611669fa-de5c-4dc2-a0e8-6041a019992a # 0000-AZ-speil-brukere
          - id: f787f900-6697-440d-a086-d5bb56e26a9c # tbd
          - id: c0227409-2085-4eb2-b487-c4ba270986a3 # nais-team-tbd
          - id: e98efc34-12d1-401f-b059-f17e62834065 # 0000-GA-Fortrolig_Adresse
          - id: e750ceb5-b70b-4d94-b4fa-9d22467b786b # 0000-GA-Egne_ansatte
          - id: 59f26eef-0a4f-4038-bf46-3a5b2f252155 # 0000-GA-SYK-BESLUTTER
          - id: e382880a-e12f-4d56-a92e-2283d7da43af # 0000-AZ-speil-stikkprøvekontroll
          - id: 08d345c6-e369-4065-b202-6209c9f31987 # speil-saksbehandler-næringsdrivende-beta
          - id: 54273224-e40a-4e3d-b3cb-2219603058f9 # speil-riksrevisjonen-lesetilgang
          - id: c5f26254-c6fa-4942-b81b-5cdff847d3df # 0000-CA-Speil_Lesetilgang
          - id: a857cdaf-9a02-4f3d-8e37-ecc81a0160d0 # 4448-CA-speil-dialogmelding_til_behandler
          - id: e98138a8-d4fa-4414-9ebc-c95539cadfe5 # graderte-andre-ytelser
          - id: 5224b99d-6c30-4b22-9151-4acac288087f # porteføljestyring
  accessPolicy:
    inbound:
      rules:
        - application: speil
          namespace: tbd
          cluster: prod-gcp
    outbound:
      rules:
        - application: spleis-api
          namespace: tbd
          cluster: prod-gcp
        - application: sp-forsikring
          namespace: tbd
          cluster: prod-gcp
        - application: speed-api
          namespace: tbd
          cluster: prod-gcp
        - application: digdir-krr-proxy
          namespace: team-rocket
          cluster: prod-gcp
        - application: sparkel-norg
          namespace: tbd
          cluster: prod-gcp
      external:
        - host: sykepengeperioder-api.prod-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        pointInTimeRecovery: true
        diskSize: 1024
        diskType: SSD
        name: spesialist
        tier: db-custom-10-20480
        retainedBackups: 14
        flags:
          - name: cloudsql.enable_pgaudit
            value: "true"
          - name: max_connections
            value: "1000"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
          - name: work_mem
            value: '16384'
        databases:
          - name: spesialist
            envVarPrefix: DATABASE
            users:
              - name: bigquery_connection_user
              - name: spesialist-db-migrations
  env:
    - name: KAFKA_RESET_POLICY
      value: none
    - name: TILGANG_SKRIV
      value: 611669fa-de5c-4dc2-a0e8-6041a019992a # 0000-AZ-speil-brukere
    - name: TILGANG_LES
      value: f787f900-6697-440d-a086-d5bb56e26a9c,54273224-e40a-4e3d-b3cb-2219603058f9,c5f26254-c6fa-4942-b81b-5cdff847d3df # tbd, speil-riksrevisjonen-lesetilgang, 0000-CA-Speil_Lesetilgang
    - name: ROLLE_BESLUTTER
      value: 59f26eef-0a4f-4038-bf46-3a5b2f252155 # 0000-GA-SYK-BESLUTTER
    - name: ROLLE_EGEN_ANSATT
      value: e750ceb5-b70b-4d94-b4fa-9d22467b786b # 0000-GA-Egne_ansatte
    - name: ROLLE_KODE_7
      value: e98efc34-12d1-401f-b059-f17e62834065 # 0000-GA-Fortrolig_Adresse
    - name: ROLLE_STIKKPROVE
      value: e382880a-e12f-4d56-a92e-2283d7da43af # 0000-AZ-speil-stikkprøvekontroll
    - name: ROLLE_SELVSTENDIG_BETA
      value: 08d345c6-e369-4065-b202-6209c9f31987,f787f900-6697-440d-a086-d5bb56e26a9c # speil-saksbehandler-næringsdrivende-beta, tbd
    - name: ROLLE_UTVIKLER
      value: c0227409-2085-4eb2-b487-c4ba270986a3 # nais-team-tbd
    - name: ROLLE_DIALOGMELDING
      value: a857cdaf-9a02-4f3d-8e37-ecc81a0160d0,c0227409-2085-4eb2-b487-c4ba270986a3 # 4448-CA-speil-dialogmelding_til_behandler, nais-team-tbd
    - name: ROLLE_PORTEFOLJESTYRING
      value: 5224b99d-6c30-4b22-9151-4acac288087f,c0227409-2085-4eb2-b487-c4ba270986a3,f787f900-6697-440d-a086-d5bb56e26a9c # porteføljestyring, nais-team-tbd, tbd
    - name: ROLLE_GRADERTE_ANDRE_YTELSER
      value: e98138a8-d4fa-4414-9ebc-c95539cadfe5 # graderte-andre-ytelser
    - name: SPLEIS_CLIENT_ID
      value: api://prod-gcp.tbd.spleis-api/.default
    - name: STIKKPROEVER_UTS_FLERE_AG_FGB_DIVISOR #Kan settes til 1 for å slå av automatisering
      value: "200"
    - name: STIKKPROEVER_UTS_FLERE_AG_FORLENGELSE_DIVISOR
      value: "400"
    - name: STIKKPROEVER_UTS_EN_AG_FGB_DIVISOR
      value: "300"
    - name: STIKKPROEVER_UTS_EN_AG_FORLENGELSE_DIVISOR
      value: "500"
    - name: STIKKPROEVER_FULL_REFUSJON_FLERE_AG_FGB_DIVISOR
      value: "300"
    - name: STIKKPROEVER_FULL_REFUSJON_FLERE_AG_FORLENGELSE_DIVISOR
      value: "500"
    - name: STIKKPROEVER_FULL_REFUSJON_EN_AG_DIVISOR
      value: "1000"
    - name: STIKKPROEVER_SN_FORLENGELSE_DIVISOR
      value: "50"
    - name: KONTAKT_OG_RESERVASJONSREGISTERET_SCOPE
      value: "api://prod-gcp.team-rocket.digdir-krr-proxy/.default"
    - name: SP_FORSIKRING_SCOPE
      value: "api://prod-gcp.tbd.sp-forsikring/.default"
    - name: SPEED_SCOPE
      value: "api://prod-gcp.tbd.speed-api/.default"
    - name: SPARKEL_NORG_SCOPE
      value: "api://prod-gcp.tbd.sparkel-norg/.default"
    - name: SPARKEL_SYKEPENGEPERIODER_API_URL
      value: "https://sykepengeperioder-api.prod-fss-pub.nais.io"
    - name: SPARKEL_SYKEPENGEPERIODER_SCOPE
      value: "api://prod-fss.tbd.sparkel-sykepengeperioder-api/.default"
    - name: TILGANGSMASKINEN_SCOPE
      value: "api://prod-gcp.tilgangsmaskin.populasjonstilgangskontroll/.default"
