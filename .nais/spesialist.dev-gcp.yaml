spec:
  ingresses:
    - https://spesialist.intern.dev.nav.no
  strategy:
    type: Recreate
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 1Gi
  replicas:
    min: 2
    max: 3
  kafka:
    pool: nav-dev
  azure:
    application:
      tenant: trygdeetaten.no
      claims:
        groups:
          - id: 2e1dc582-f762-4510-a660-88bf68fb7128 # 0000-GA-Fortrolig_Adresse
          - id: 602c1187-a92c-4fce-a983-3a1258161d4f # 0000-CA-Speil-Beslutter
          - id: cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Saksbehandler
          - id: eb0c8da8-e73b-4be2-bd09-1fa71001eb29 # 0000-CA-Speil-Stikkprove
          - id: 216b7219-3906-43c5-8e22-03fb74133b42 # 0000-CA-Speil_Lesetilgang
  accessPolicy:
    inbound:
      rules:
        - application: speil
          cluster: dev-gcp
    outbound:
      rules:
        - application: spleis-api
          namespace: tbd
          cluster: dev-gcp
        - application: sp-forsikring
          namespace: tbd
          cluster: dev-gcp
        - application: speed-api
          namespace: tbd
          cluster: dev-gcp
        - application: digdir-krr-proxy
          namespace: team-rocket
          cluster: dev-gcp
        - application: sparkel-norg
          namespace: tbd
          cluster: dev-gcp
      external:
        - host: sykepengeperioder-api.dev-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        tier: db-f1-micro
        flags:
          - name: cloudsql.enable_pgaudit
            value: "true"
          - name: pgaudit.log
            value: 'write'
        databases:
          - name: spesialist
            envVarPrefix: DATABASE
            users:
              - name: spesialist-db-migrations
              - name: spesialist-opprydding-dev
  env:
    - name: KAFKA_EXTRA_TOPIC
      value: tbd.sis
    - name: TILGANG_SKRIV
      value: cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Saksbehandler
    - name: TILGANG_LES
      value: 216b7219-3906-43c5-8e22-03fb74133b42 # 0000-CA-Speil_Lesetilgang
    - name: ROLLE_BESLUTTER
      value: 602c1187-a92c-4fce-a983-3a1258161d4f,cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Beslutter, 0000-CA-Speil-Saksbehandler
    - name: ROLLE_EGEN_ANSATT
      value: cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Saksbehandler
    - name: ROLLE_KODE_7
      value: 2e1dc582-f762-4510-a660-88bf68fb7128 # 0000-GA-Fortrolig_Adresse
    - name: ROLLE_STIKKPROVE
      value: eb0c8da8-e73b-4be2-bd09-1fa71001eb29 # 0000-CA-Speil-Stikkprove
    - name: ROLLE_SELVSTENDIG_BETA
      value: cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Saksbehandler
    - name: ROLLE_UTVIKLER
      value: cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Saksbehandler
    - name: ROLLE_DIALOGMELDING
      value: cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Saksbehandler
    - name: ROLLE_PORTEFOLJESTYRING
      value: cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Saksbehandler
    - name: ROLLE_GRADERTE_ANDRE_YTELSER
      value: cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Saksbehandler
    - name: SPLEIS_CLIENT_ID
      value: api://dev-gcp.tbd.spleis-api/.default
    - name: SPLEIS_CLIENT_LOGG_RESPONS
      value: "true"
    - name: KONTAKT_OG_RESERVASJONSREGISTERET_SCOPE
      value: "api://dev-gcp.team-rocket.digdir-krr-proxy/.default"
    - name: SP_FORSIKRING_SCOPE
      value: "api://dev-gcp.tbd.sp-forsikring/.default"
    - name: SPEED_SCOPE
      value: "api://dev-gcp.tbd.speed-api/.default"
    - name: SPARKEL_NORG_SCOPE
      value: "api://dev-gcp.tbd.sparkel-norg/.default"
    - name: SPARKEL_SYKEPENGEPERIODER_API_URL
      value: "https://sykepengeperioder-api.dev-fss-pub.nais.io"
    - name: SPARKEL_SYKEPENGEPERIODER_SCOPE
      value: "api://dev-fss.tbd.sparkel-sykepengeperioder-api/.default"
    - name: TILGANGSMASKINEN_SCOPE
      value: "api://dev-gcp.tilgangsmaskin.populasjonstilgangskontroll/.default"
    - name: TILLAT_GODKJENNING_UTEN_BESLUTTERTILGANG
      value: "true"
    - name: TILLAT_GODKJENNING_AV_EGEN_SAK
      value: "true"
    - name: IGNORER_MELDINGER_FOR_UKJENTE_PERSONER
      value: "true"
    - name: EKSPONER_OPENAPI
      value: "true"
