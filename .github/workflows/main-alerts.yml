name: Deploy alerts
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main-alerts.yml'
      - '.nais/prod-alerts.yaml'
      - '.nais/prod-alertconfig.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for nais login

jobs:
  deploy-prod:
    name: Deploy til prod
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@5ff5fbfcd847f89bd33941fd4a6212de7b3eb749 # v1.0.13
    with:
      manifest: .nais/prod-alerts.yaml
      environment: prod-gcp
      extra_manifests: .nais/prod-alertconfig.yaml
    permissions:
      contents: read
      id-token: write # for nais login
